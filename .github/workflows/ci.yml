name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      # All build/test/validation logic lives in Cake Frosting, not YAML.
      - name: Run CI pipeline (Cake)
        run: dotnet run --project build/CentralLogin.Build --configuration Release -- --target=CI
