# =====================================================================
# CentralLogin — Keycloak login theme
# Extends the stock "keycloak" login theme (PatternFly base + templates).
# We keep the parent's stylesheet — "css/login.css" resolves to the parent
# theme by inheritance — and append our own "css/custom.css" AFTER it, so our
# Deep Teal design tokens win by cascade order without rebuilding the layout.
# Applied per-realm via Realm settings -> Themes -> Login theme = central-login.
# =====================================================================

parent=keycloak
import=common/keycloak

styles=css/login.css css/custom.css
