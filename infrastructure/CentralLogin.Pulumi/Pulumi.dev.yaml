# Development stack configuration.
# Non-secret values only. Set secrets with:
#   pulumi config set --secret central-login:keycloakDbPassword <value>
#   pulumi config set --secret central-login:webClientSecret   <value>
config:
  central-login:cloudProvider: azure       # none | azure | aws | gcp | kubernetes
  central-login:domain: REPLACE_WITH_DEV_DOMAIN
  # Azure — supply your own account/region values (not invented here):
  #   pulumi config set central-login:azureLocation <your-azure-region>   # e.g. westeurope
  #   pulumi config set central-login:azureTenantId <your-azure-tenant-id>
  #   pulumi config set azure-native:subscriptionId <your-subscription-id>
